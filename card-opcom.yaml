# Card OPCOM interactiv: cardul mic + popup (browser_mod) cu graficul pe 60 min și detaliul pe 15 min.
# Entitatea-sursă: sensor.opcom_pzu_pret_acum (integrarea nativă opcom_pzu). Popup = un singur button-card, selecția e stare locală în DOM (fără helperi). Generat de construieste.py; nu edita de mână.
# Dacă senzorul se numește altfel: caută și înlocuiește „sensor.opcom_pzu_pret_acum” în tot fișierul (apare în fiecare card).
type: custom:button-card
entity: sensor.opcom_pzu_pret_acum
show_name: false
show_icon: false
show_state: false
show_label: false
tap_action:
  action: fire-dom-event
  browser_mod:
    service: browser_mod.popup
    data:
      title: Preț energie OPCOM · 60 min · lei/kWh
      size: wide
      dismissable: true
      right_button: Închide
      content:
        type: custom:button-card
        entity: sensor.opcom_pzu_pret_acum
        show_name: false
        show_icon: false
        show_state: false
        show_label: false
        tap_action:
          action: none
        hold_action:
          action: none
        styles:
          card:
          - padding: 0px
          - background: none
          - border: none
          - box-shadow: none
          - border-radius: 0px
          - overflow: visible
          grid:
          - grid-template-areas: '"f"'
          - grid-template-columns: minmax(0, 1fr)
          custom_fields:
            f:
            - width: 100%
            - min-width: '0'
        extra_styles: ':host{display:block;width:100%;min-width:0}#aspect-ratio{display:block!important}.opp{white-space:normal;pointer-events:auto;min-width:0;box-sizing:border-box;overflow:hidden;font-family:Rajdhani,sans-serif;color:#e6f7ff;text-align:left;display:flex;flex-direction:column;gap:8px;width:100%}.opp[data-z=azi] .zb[data-z=maine],.opp[data-z=maine] .zb[data-z=azi]{display:none}.zb,.box,.dp{min-width:0}.zb{display:flex;flex-direction:column;gap:8px}.bts{display:flex;gap:8px}.bt{flex:1 1 0;min-width:0;text-align:center;padding:8px 0;border-radius:10px;border:1px solid rgba(0,229,255,.45);background:rgba(255,255,255,.04);font-weight:700;font-size:14px;letter-spacing:1.5px;cursor:pointer;user-select:none}.bt.act{background:rgba(0,229,255,.25)}.bt[data-off]{opacity:.5;cursor:default}.box{padding:12px 10px;background:linear-gradient(170deg,rgba(255,255,255,.05),rgba(8,12,24,.95));border:1px solid rgba(0,229,255,.55);border-radius:14px;box-shadow:0 0 14px rgba(0,229,255,.22),inset 0 0 20px rgba(0,229,255,.07)}.box.chart{padding:12px 6px 8px}.cols{display:grid;gap:0 2px;align-items:start}.dp{display:none}.dp.on{display:block}.sh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;font-size:13px;font-weight:700;letter-spacing:1px;color:#9ab;margin-bottom:4px}.sh span{min-width:0;overflow-wrap:anywhere}.sh b{min-width:0;font-size:14px;color:#fff;letter-spacing:.3px}.sh em{font-style:normal}.ief{color:#00e676}.med{color:#00e5ff}.scp{color:#ff7043}.nt{font-size:12px;color:#789}.gol{padding:26px 0;text-align:center;color:#9ab;font-size:15px;letter-spacing:1px}.ls4{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-top:8px}.sl{border:1px solid rgba(0,229,255,.3);border-radius:10px;padding:8px 6px 6px;text-align:center;background:rgba(255,255,255,.04)}.sl.ief{border-color:rgba(0,230,118,.6)}.sl.scp{border-color:rgba(255,112,67,.6)}.sl.cur{outline:2px solid #fff;box-shadow:0 0 10px rgba(255,255,255,.5)}.sl .t{font-size:15px;font-weight:700;color:#fff;letter-spacing:1px}.sl .p{font-size:26px;font-weight:700;line-height:1.1}.sl .u{font-size:11px;color:#9ab}.sl .m{font-size:12px;color:#9ab;margin-top:2px}.ft{font-size:11px;color:#789}.col{display:flex;flex-direction:column;align-items:center;box-sizing:border-box;border-radius:6px;padding:3px 0 2px;border:1px solid transparent;cursor:pointer;user-select:none}.plot{height:150px;width:100%;display:flex;align-items:flex-end;justify-content:center}.bar{width:76%;border-radius:3px 3px 0 0;opacity:.9}.bar.ief{background:linear-gradient(0deg,rgba(0,230,118,.25),#00e676)}.bar.med{background:linear-gradient(0deg,rgba(0,229,255,.2),#00e5ff)}.bar.scp{background:linear-gradient(0deg,rgba(255,112,67,.25),#ff7043)}.pr{margin-top:4px;font-size:11px;font-weight:700;line-height:1;writing-mode:vertical-rl;transform:rotate(180deg);height:31px;white-space:nowrap}.mk{height:9px;font-size:8px;line-height:9px;color:#ffd54f}.hh{font-size:11px;color:#9ab;font-weight:600;line-height:1.1}.hh sup{font-size:7px}.col.cur .hh{color:#ffd54f;font-weight:700}.col.trec .bar,.col.trec .pr{opacity:.5}.col.sel{background:rgba(255,255,255,.1);border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.45)}.col.sel .bar{opacity:1}@media (min-width:700px){.pr{writing-mode:horizontal-tb;transform:none;height:auto;font-size:10.5px}}@media (max-width:480px){.bt{font-size:12px;letter-spacing:.5px}.bts{gap:6px}.sh{letter-spacing:.5px}.hh{font-size:10px;letter-spacing:-.3px}}'
        custom_fields:
          f: |-
            [[[
              // Popup OPCOM: UN singur button-card; graficul, detaliul de 15 min și butoanele sunt HTML.
              // Selecția (ziua, ora) e STARE LOCALĂ în DOM, schimbată de un singur onclick delegat: nu depinde de helperi
              // și nu cere ca popup-ul browser_mod să primească actualizări de `hass`. Fără `variables`.
              const a = entity.attributes || {};
              const lt = ms => new Date(ms).toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: 'Europe/Bucharest' });
              const kwh = v => (v / 1000).toFixed(3);
              const dd = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) : '';
              const nivel = (v, arr) => {
                const s = arr.slice().sort((x, y) => x - y), t1 = s[Math.floor(s.length / 3)], t2 = s[Math.floor(2 * s.length / 3)];
                return v <= t1 ? 'ief' : v <= t2 ? 'med' : 'scp';
              };
              const ora_loc = Number(new Date().toLocaleString('en-GB', { hour: '2-digit', hourCycle: 'h23', timeZone: 'Europe/Bucharest' }));
              // handler-ul unic (delegat pe rădăcină): schimbă ziua / ora în DOM-ul local
              window.__opcomPop = { go(ev) {
                const t = ev.target && ev.target.closest ? ev.target.closest('[data-go]') : null;
                if (!t || t.hasAttribute('data-off')) return;
                const root = ev.currentTarget, g = t.getAttribute('data-go');
                let z, h;
                if (g === 'cur') { z = 'azi'; h = root.dataset.cur; }
                else if (g === 'azi' || g === 'maine') { z = g; h = root.dataset['h' + g]; }
                else { z = g.split(':')[0]; h = g.split(':')[1]; }
                h = Number(h);
                root.dataset.z = z; root.dataset['h' + z] = h;
                const b = root.querySelector('.zb[data-z="' + z + '"]');
                if (b) {
                  b.querySelectorAll('.sel,.on').forEach(e => e.classList.remove('sel', 'on'));
                  const c = b.querySelector('.col[data-h="' + h + '"]'); if (c) c.classList.add('sel');
                  const d = b.querySelector('.dp[data-h="' + h + '"]'); if (d) d.classList.add('on');
                }
                root.querySelectorAll('.bt').forEach(e => {
                  const k = e.getAttribute('data-go');
                  e.classList.toggle('act', k === 'cur' ? (z === 'azi' && Number(root.dataset.hazi) === Number(root.dataset.cur)) : k === z);
                });
              } };
              const zb = z => {
                const A = a[z + '_60'] || [], B = a[z + '_15'] || [], st = a[z + '_start_utc'] || [], n = A.length;
                const ZT = (z === 'maine' ? 'MÂINE ' : 'AZI ') + dd(z === 'maine' ? a.data_maine : a.data_azi);
                if (!n) return { html: `<div class="zb" data-z="${z}"><div class="box"><div class="gol">${z === 'maine' ? 'Prețurile pentru mâine apar după 14:00' : 'Fără prețuri pentru azi'}</div></div></div>`, n: 0, cur: -1, sel: 0 };
                // eticheta HH:MM a slotului de 15 min s; cu *_start_utc e corectă și în zile de 23/25 h
                const lab = s => {
                  if (st[s]) return lt(Date.parse(st[s]));
                  if (st.length && s >= st.length) return lt(Date.parse(st[st.length - 1]) + (s - st.length + 1) * 900000);
                  const m = s * 15; return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
                };
                const hh = s => lab(4 * s).slice(0, 2);
                let cur = -1;
                if (z === 'azi') { cur = st.length ? Math.floor(Math.floor((Date.now() - Date.parse(st[0])) / 900000) / 4) : ora_loc; if (cur < 0 || cur >= n) cur = -1; }
                const sel = cur >= 0 ? cur : Math.min(ora_loc, n - 1);
                const slot_cur = (z === 'azi' && st.length) ? Math.floor((Date.now() - Date.parse(st[0])) / 900000) : -1;
                // sloturi fără preț (null, ex. lipsește ziua OPCOM de ieri) nu intră în min/medie/max/niveluri
                const V = A.filter(x => x != null), mn = Math.min(...V), mx = Math.max(...V), md = V.reduce((x, y) => x + y, 0) / V.length;
                const cols = A.map((v, i) => {
                  if (v == null) return `<div class="col${i === sel ? ' sel' : ''}${i === cur ? ' cur' : ''}" data-go="${z}:${i}" data-h="${i}"><div class="plot"><div class="bar" style="height:4px;opacity:.35"></div></div><div class="pr">–</div><div class="mk">${i === cur ? '▲' : ''}</div><div class="hh">${hh(i)}${i > 0 && hh(i) === hh(i - 1) ? '<sup>b</sup>' : ''}</div></div>`;
                  const lvl = nivel(v, V), px = Math.round(14 + (mx > mn ? (v - mn) / (mx - mn) : 0.5) * 136);
                  const cls = (i === sel ? ' sel' : '') + (i === cur ? ' cur' : '') + (cur >= 0 && i < cur ? ' trec' : '');
                  return `<div class="col${cls}" data-go="${z}:${i}" data-h="${i}"><div class="plot"><div class="bar ${lvl}" style="height:${px}px"></div></div><div class="pr ${lvl}">${kwh(v)}</div><div class="mk">${i === cur ? '▲' : ''}</div><div class="hh">${hh(i)}${i > 0 && hh(i) === hh(i - 1) ? '<sup>b</sup>' : ''}</div></div>`;
                }).join('');
                const tile = s => {
                  const v = B[s];
                  if (v == null) return `<div class="sl"><div class="t">${lab(s)}</div><div class="p">–</div><div class="m">fără preț</div></div>`;
                  const l = nivel(v, B.filter(x => x != null));
                  return `<div class="sl ${l}${s === slot_cur ? ' cur' : ''}"><div class="t">${lab(s)}</div><div class="p ${l}">${kwh(v)}</div><div class="u">lei/kWh</div><div class="m">${Number(v).toFixed(2)} lei/MWh</div></div>`;
                };
                const dps = A.map((v, i) => `<div class="dp${i === sel ? ' on' : ''}" data-h="${i}"><div class="sh"><span>DETALIU 15 MIN · ORA ${lab(4 * i)}–${lab(4 * (i + 1))} · ${ZT}</span><b>${v == null ? 'media orei: fără preț' : `media orei: <em class="${nivel(v, V)}">${kwh(v)} lei/kWh</em> · ${Number(v).toFixed(2)} lei/MWh`}</b></div><div class="ls4">${[0, 1, 2, 3].map(j => tile(4 * i + j)).join('')}</div></div>`).join('');
                const html = `<div class="zb" data-z="${z}"><div class="box"><div class="sh"><span>${ZT} · LA 60 MINUTE · lei/kWh</span><b><em class="ief">min ${kwh(mn)}</em> · medie ${kwh(md)} · <em class="scp">max ${kwh(mx)}</em></b></div><div class="nt">Apasă o coloană pentru prețul pe 15 minute</div></div>
                  <div class="box chart"><div class="cols" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${cols}</div></div>
                  <div class="box">${dps}</div></div>`;
                return { html, n, cur, sel };
              };
              const Z = zb('azi'), M = zb('maine');
              const mOk = M.n > 0;
              const bt = (go, txt, act, off) => `<div class="bt${act ? ' act' : ''}" data-go="${go}"${off ? ' data-off="1"' : ''}>${txt}</div>`;
              return `<div class="opp" data-z="azi" data-hazi="${Z.sel}" data-hmaine="${M.sel}" data-cur="${Z.cur >= 0 ? Z.cur : Z.sel}" onclick="window.__opcomPop.go(event)">
                <div class="bts">${bt('azi', 'AZI', true, false)}${bt('maine', 'MÂINE' + (mOk ? '' : ' ⏳'), false, !mOk)}${bt('cur', 'ORA CURENTĂ', true, false)}</div>
                ${Z.html}${M.html}
                <div class="ft">Sursă: OPCOM PZU · integrarea opcom_pzu · lei/kWh = lei/MWh ÷ 1000 · verde ieftin · turcoaz mediu · portocaliu scump</div>
              </div>`;
            ]]]
hold_action:
  action: more-info
styles:
  card:
  - padding: 0px
  - background: none
  - border: none
  - box-shadow: none
  - overflow: visible
  grid:
  - grid-template-areas: '"f"'
  - grid-template-columns: 1fr
  custom_fields:
    f:
    - width: 100%
extra_styles: '.op{--c:0,229,255;position:relative;box-sizing:border-box;border-radius:14px;padding:12px 14px;background:linear-gradient(170deg,rgba(255,255,255,.05),rgba(8,12,24,.95));border:1px solid rgba(var(--c),.55);box-shadow:0 0 14px rgba(var(--c),.22),inset 0 0 20px rgba(var(--c),.07);font-family:Rajdhani,sans-serif;color:#e6f7ff;text-align:left}.op:before{content:'''';position:absolute;left:10%;right:10%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgb(var(--c)),transparent)}.hd{display:flex;align-items:center;gap:8px}.hd ha-icon{--mdc-icon-size:22px;color:rgb(var(--c));filter:drop-shadow(0 0 4px rgb(var(--c)))}.ti{font-size:19px;font-weight:700;letter-spacing:1.5px;color:#fff;text-shadow:0 0 8px rgba(var(--c),.8)}.bd{margin-left:auto;font-size:13px;font-weight:700;letter-spacing:1px;padding:2px 9px;border-radius:10px;color:rgb(var(--c));border:1px solid rgba(var(--c),.6);background:rgba(var(--c),.1)}.top{display:flex;align-items:center;gap:12px;margin:10px 0 4px}.big{font-size:40px;font-weight:700;line-height:1;color:#fff}.big small{font-size:16px;color:rgb(var(--c))}.big .sub{font-size:12px;color:#9ab;font-weight:600;letter-spacing:.5px;margin-top:3px}.big.ief{text-shadow:0 0 12px #00e676}.big.med{text-shadow:0 0 12px rgb(var(--c))}.big.scp{text-shadow:0 0 12px #ff5252}.mm{margin-left:auto;display:flex;gap:6px}.mm div{border:1px solid rgba(var(--c),.3);border-radius:9px;padding:3px 7px;text-align:center;background:rgba(255,255,255,.04)}.mm span{display:block;font-size:11px;color:#9ab;font-weight:700;letter-spacing:1px}.mm b{font-size:17px}.ief{color:#00e676}.med{color:rgb(0,229,255)}.scp{color:#ff7043}em{font-style:normal}.op input{display:none}.tabs{display:flex;gap:6px;margin-top:10px}.tabs label{flex:1;text-align:center;font-size:13px;font-weight:700;letter-spacing:1.5px;padding:5px 0;border-radius:9px;border:1px solid rgba(var(--c),.4);color:#9ab;cursor:pointer;user-select:none}.tabs .taz{margin-left:10px}#o15:checked~.tabs .t15,#o30:checked~.tabs .t30,#o60:checked~.tabs .t60,#oaz:checked~.tabs .taz,#oma:checked~.tabs .tma{color:#fff;background:rgba(var(--c),.18);border-color:rgb(var(--c));box-shadow:0 0 10px rgba(var(--c),.5)}.v{display:none;margin-top:10px;padding-top:8px;border-top:1px solid rgba(var(--c),.25)}#o15:checked~#oaz:checked~.vs .v15azi,#o15:checked~#oma:checked~.vs .v15maine,#o30:checked~#oaz:checked~.vs .v30azi,#o60:checked~#oaz:checked~.vs .v60azi,#o30:checked~#oma:checked~.vs .v30maine,#o60:checked~#oma:checked~.vs .v60maine{display:block}.sh{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:700;letter-spacing:1px;color:#9ab;margin-bottom:6px}.sh b{font-size:14px;color:#fff;letter-spacing:.3px;text-align:right}.ch2{display:flex;align-items:flex-end;gap:2px;height:110px}.v15azi .ch2,.v15maine .ch2{gap:1px}.b{flex:1;border-radius:3px 3px 0 0;opacity:.9}.b.ief{background:linear-gradient(0deg,rgba(0,230,118,.25),#00e676)}.b.med{background:linear-gradient(0deg,rgba(0,229,255,.2),#00e5ff)}.b.scp{background:linear-gradient(0deg,rgba(255,112,67,.25),#ff7043)}.b.trec{opacity:.3}.b.cur{opacity:1;outline:2px solid #fff;box-shadow:0 0 10px #fff}.ax{position:relative;height:14px;font-size:11px;color:#789}.ax span{position:absolute;transform:translateX(-50%)}.ax span:first-child{transform:none}.ax span:last-child{transform:translateX(-100%)}.chs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px}.chs small{font-size:12px;color:#9ab;margin-right:2px}.ch{font-style:normal;font-size:12px;font-weight:700;color:#00e676;padding:1px 7px;border-radius:8px;border:1px solid rgba(0,230,118,.55);background:rgba(0,230,118,.08)}.ls{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.li{border:1px solid rgba(var(--c),.25);border-radius:8px;padding:3px 6px;display:flex;justify-content:space-between;font-size:13px;background:rgba(255,255,255,.03)}.li span{color:#9ab}.li.cur{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.5)}.gol{padding:26px 0;text-align:center;color:#9ab;font-size:15px;letter-spacing:1px}.ft{margin-top:8px;font-size:11px;color:#789}'
custom_fields:
  f: |-
    [[[
    // Card OPCOM PZU — date: sensor.opcom_pzu_pret_acum, furnizat de integrarea opcom_pzu.
    // Atribute: azi_15/30/60, maine_15/30/60 = prețuri (lei/MWh) pe 15 min și medii pe 30/60 min, în ordinea zilei locale (92/96/100 sloturi de 15 min).
    // azi_start_utc / maine_start_utc = începutul fiecărui slot de 15 min (UTC); cu ele etichetele și intervalul curent sunt corecte și în zilele de 23/25 h.
    // Fără aceste atribute (versiune veche a fluxului) cardul calculează ca înainte, din ceas (corect doar în zile de 24 h).
    const a = entity.attributes || {};
    const S = window.__opcomCard || (window.__opcomCard = { pas: 60, zi: "azi" });   // alegerea rămâne după actualizări
    const d = new Date(), MIN = d.getHours() * 60 + d.getMinutes();
    const kwh = v => (v / 1000).toFixed(3);
    const lt = ms => new Date(ms).toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: "Europe/Bucharest" });
    const st = zi => a[zi + "_start_utc"] || [];
    // eticheta de început al intervalului i (pas minute) din ziua zi; sfârșitul = începutul lui i+1
    const et = (i, pas, zi) => { const s = st(zi || "azi"), k = i * pas / 15;
      if (s[k]) return lt(Date.parse(s[k]));
      if (s.length && k >= s.length) return lt(Date.parse(s[s.length - 1]) + (k - s.length + 1) * 900000);
      const m = i * pas; return String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
    // indexul intervalului curent (pas minute) în ziua de azi
    const curIdx = pas => { const s = st("azi"), n = Date.now(); if (!s.length) return Math.floor(MIN / pas);
      const k = Math.floor((n - Date.parse(s[0])) / 900000); return Math.floor(k * 15 / pas); };
    function nivel(v, arr) {
      const s = arr.slice().sort((x, y) => x - y), t1 = s[Math.floor(s.length / 3)], t2 = s[Math.floor(2 * s.length / 3)];
      return v <= t1 ? "ief" : v <= t2 ? "med" : "scp";
    }
    function vedere(zi, pas) {
      const arr = a[zi + "_" + pas] || [];
      if (!arr.length) return `<div class="gol">${zi === "maine" ? "Prețurile pentru mâine apar după 14:00" : "Fără prețuri pentru azi"}</div>`;
      const mx = Math.max(...arr), mn = Math.min(...arr), cur = zi === "azi" ? curIdx(pas) : -1;
      const bare = arr.map((v, i) => `<div class="b ${nivel(v, arr)}${i === cur ? " cur" : ""}${i < cur ? " trec" : ""}" style="height:${Math.round(18 + (mx > mn ? (v - mn) / (mx - mn) : 0.5) * 92)}px"></div>`).join("");
      const ax = [0, 6, 12, 18, 24].map(o => `<span style="left:${o / 24 * 100}%">${String(o).padStart(2, "0")}</span>`).join("");
      const ramase = arr.map((v, i) => [v, i]).filter(x => x[1] >= Math.max(cur, 0));
      const ief = ramase.slice().sort((x, y) => x[0] - y[0]).slice(0, 3).sort((x, y) => x[1] - y[1])
        .map(([v, i]) => `<i class="ch">${et(i, pas, zi)}–${et(i + 1, pas, zi)} · ${kwh(v)}</i>`).join("");
      const medie = arr.reduce((x, y) => x + y, 0) / arr.length;
      const sh = zi === "azi" && arr[cur] != null
        ? `acum ${et(cur, pas, zi)}–${et(cur + 1, pas, zi)}: <em class="${nivel(arr[cur], arr)}">${kwh(arr[cur])} lei/kWh</em>`
        : `min <em class="ief">${kwh(mn)}</em> · medie ${kwh(medie)} · max <em class="scp">${kwh(mx)}</em>`;
      const lista = (zi === "azi" ? ramase.slice(0, pas === 60 ? 8 : 12) : [])
        .map(([v, i]) => `<div class="li${i === cur ? " cur" : ""}"><span>${et(i, pas, zi)}</span><b class="${nivel(v, arr)}">${kwh(v)}</b></div>`).join("");
      return `<div class="sh"><span>${zi === "azi" ? "AZI" : "MÂINE"} · LA ${pas} MINUTE</span><b>${sh}</b></div>
        <div class="ch2">${bare}</div><div class="ax">${ax}</div>
        <div class="chs"><small>${zi === "azi" ? "cele mai ieftine rămase:" : "cele mai ieftine:"}</small>${ief}</div>
        ${lista ? `<div class="ls">${lista}</div>` : ""}`;
    }
    // numărul mare = media orei curente, ca pe opcom.ro la „60min”; prețul pe 15 min apare dedesubt
    const p15 = Number(entity.state), az = a.azi || {}, a60 = a.azi_60 || [];
    const c60 = curIdx(60), ora = a60[c60], pa = ora != null ? Number(ora) : p15;
    const nv = a60.length && !isNaN(pa) ? nivel(pa, a60.filter(x => x != null)) : "med";
    // min/medie/max pe ore (ca tabelul OPCOM „60min”); dacă lipsesc, cele pe 15 min
    const a60f = a60.filter(x => x != null);   // fără sloturi lipsă (null)
    const mm = a60f.length ? { min: Math.min(...a60f), max: Math.max(...a60f), medie: a60f.reduce((x, y) => x + y, 0) / a60f.length } : az;
    const ck = c => c ? "checked" : "";
    // button-card blochează clicul implicit pe <label>, așa că bifăm direct și ținem minte alegerea; opresc propagarea ca atingerea taburilor să nu deschidă popup-ul
    const tab = (id, cls, cheie, val, text) => `<label class="${cls}" onmousedown="event.stopPropagation()" onmouseup="event.stopPropagation()" ontouchstart="event.stopPropagation()" ontouchend="event.stopPropagation()" onpointerdown="event.stopPropagation()" onpointerup="event.stopPropagation()" onclick="event.stopPropagation();this.getRootNode().getElementById('${id}').checked=true;window.__opcomCard.${cheie}=${val}">${text}</label>`;
    const v = (zi, pas) => `<div class="v v${pas}${zi}">${vedere(zi, pas)}</div>`;
    return `<div class="op">
      <div class="hd"><ha-icon icon="mdi:flash"></ha-icon><span class="ti">PREȚ ENERGIE OPCOM</span><span class="bd">PZU</span></div>
      <div class="top"><div class="big ${nv}">${isNaN(pa) ? "–" : kwh(pa)}<small> lei/kWh</small><div class="sub">${isNaN(pa) ? "–" : pa.toFixed(2)} lei/MWh · ora ${et(c60, 60)}–${et(c60 + 1, 60)}</div><div class="sub">${isNaN(p15) ? "" : "acum pe 15 min: " + kwh(p15) + " lei/kWh"}</div></div>
        <div class="mm"><div><span>MIN</span><b class="ief">${mm.min != null ? kwh(mm.min) : "–"}</b></div><div><span>MEDIE</span><b>${mm.medie != null ? kwh(mm.medie) : "–"}</b></div><div><span>MAX</span><b class="scp">${mm.max != null ? kwh(mm.max) : "–"}</b></div></div></div>
      <input type="radio" name="opp" id="o15" ${ck(S.pas === 15)}><input type="radio" name="opp" id="o30" ${ck(S.pas === 30)}><input type="radio" name="opp" id="o60" ${ck(S.pas === 60)}>
      <input type="radio" name="opz" id="oaz" ${ck(S.zi === "azi")}><input type="radio" name="opz" id="oma" ${ck(S.zi === "maine")}>
      <div class="tabs">${tab("o15", "t15", "pas", 15, "15 MIN")}${tab("o30", "t30", "pas", 30, "30 MIN")}${tab("o60", "t60", "pas", 60, "60 MIN")}${tab("oaz", "taz", "zi", "'azi'", "AZI")}${tab("oma", "tma", "zi", "'maine'", "MÂINE" + (a.maine_disponibil ? "" : " ⏳"))}</div>
      <div class="vs">${v("azi", 15)}${v("maine", 15)}${v("azi", 30)}${v("azi", 60)}${v("maine", 30)}${v("maine", 60)}</div>
      <div class="ft">OPCOM PZU · integrarea opcom_pzu · verde ieftin · turcoaz mediu · portocaliu scump</div>
    </div>`;
    ]]]
